sumo:
  binary: sumo
  configuration: path/to/network.sumocfg
  snapshot_directory: artifacts/snapshots
  flow_lanes:
    traffic_light_id: [lane_id]
network:
  nodes: [traffic_light_id]
  lanes: [lane_id]
  adjacency: [[1.0]]
actions:
  - name: signal
    lower: [0.2, 0.2, 0.2]
    upper: [1.0, 1.0, 1.0]
  - name: flow
    lower: [0.4, 0.4, 0.4]
    upper: [1.0, 1.0, 1.0]
  - name: diversion
    lower: [0.0, 0.0, 0.0]
    upper: [0.3, 0.3, 0.3]
scenarios:
  train: path/to/train.json
  validation: path/to/validation.json
  test: path/to/test.json
